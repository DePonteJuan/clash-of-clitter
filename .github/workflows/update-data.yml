name: Update evolution data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape wiki
        run: node scripts/scrape-wiki.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evolutions.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update Tatari evolution data from wiki"
            git push
          fi
